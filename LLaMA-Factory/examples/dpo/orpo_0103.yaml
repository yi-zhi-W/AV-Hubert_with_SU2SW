### model
model_name_or_path: /nfs4/wyz/merged_qwen2audio/lora_5l_merged
trust_remote_code: true

### method
# --- 核心修改 1: 切换算法到 ORPO ---
stage: dpo
do_train: true
finetuning_type: lora
pref_loss: orpo

# --- 保持显式指定，只训练文本层 ---
lora_target: all

# --- 核心修改 2: ORPO 参数 ---
# ORPO 不需要 ref model，且自带 SFT loss，所以 beta 可以给低一点，0.1 是标准值
pref_beta: 0.1         
# pref_loss: sigmoid  <-- ORPO 不需要这个参数，自动处理

### dataset
# 继续使用你的全量数据
dataset: dpo_ug_cer>010
template: qwen2_audio
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/orpo/orpo0103_ug_cer>010
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
# --- 核心修改 3: 学习率回升 ---
# 因为 ORPO 有 SFT Loss 托底，不容易崩，可以用回 1e-6 甚至 3e-6
# 建议先用 1e-6
learning_rate: 1.0e-6             
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
gradient_checkpointing: true